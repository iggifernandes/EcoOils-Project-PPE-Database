<title>PPE Request & Issue – EcoOils Mentari</title>
<style>
:root{--g:#0b5d3b;--g2:#e8f3ee;--r:#b42318;--o:#b54708;--l:#d0d5dd;--m:#667085;--bg:#f6f7f8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:#1a1a1a;padding-bottom:48px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:16px;margin:0}.lang button{background:#ffffff22;color:#fff;border:1px solid #fff6;border-radius:6px;padding:4px 10px;margin-left:4px;cursor:pointer}
.lang button.on{background:#fff;color:var(--g);font-weight:700}
main{max-width:780px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:12px}
.card.hl{outline:3px solid #f79009}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;font-size:16px;background:#fff}
button{font-family:inherit;cursor:pointer}
button.p{background:var(--g);color:#fff;border:0;border-radius:8px;padding:13px;font-size:16px;font-weight:700;width:100%;margin-top:12px}
button.s{background:#fff;color:var(--g);border:1px solid var(--g);border-radius:8px;padding:9px 12px;font-size:14px}
button.d{background:#fff;color:var(--r);border:1px solid var(--r);border-radius:8px;padding:9px 12px;font-size:14px}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1 0 auto;padding:10px 12px;border:1px solid var(--l);background:#fff;border-radius:8px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:grid;grid-template-columns:2fr 1fr 64px 34px;gap:6px;margin-bottom:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.Requested{background:#fef0c7;color:var(--o)}.Approved{background:#d1e9ff;color:#175cd3}.Issued{background:#d1fadf;color:#027a48}.Rejected,.Voided,.Cancelled{background:#fee4e2;color:var(--r)}.Expired{background:#eaecf0;color:var(--m)}
.err{background:#fee4e2;color:var(--r);padding:10px;border-radius:8px;margin-top:10px}.ok{background:#d1fadf;color:#027a48;padding:10px;border-radius:8px;margin-top:10px}
.flag.inf{background:#d1e9ff;color:#175cd3}
.flag{background:#fee4e2;color:var(--r);padding:4px 8px;border-radius:6px;font-size:13px;margin:3px 0;display:block}
.small{font-size:13px;color:var(--m)}.rec{border-top:1px solid var(--l);padding:10px 0}.rec:first-child{border-top:0}
.items{background:var(--g2);padding:8px 10px;border-radius:8px;margin:8px 0;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:10px}.sum div{background:#fff;border:1px solid var(--l);border-radius:8px;text-align:center;padding:8px 2px;font-size:12px;color:var(--m)}.sum b{display:block;font-size:20px;color:#1a1a1a}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.bar span.n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:14px;background:var(--g);border-radius:4px}.bar b{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--l);padding:6px 4px;text-align:left}tr.low td{background:#fee4e2}
.otp{font-size:34px;letter-spacing:8px;text-align:center}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;background:#fff;border-top:1px solid var(--l);padding:8px;font-size:12px;color:var(--m)}
.hide{display:none}
img.ph{max-width:100%;border-radius:8px;margin-top:6px}
@media print{header,.tabs,footer,.noprint{display:none!important}body{background:#fff}}
</style>

async function api(body){
  try{ const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); return await r.json(); }
  catch(e){ return {ok:false,error:'NETWORK'}; }
}
const E = r => esc(err(r.error)) + (r.detail ? ' ' + esc(r.detail) : '') + (r.left != null ? ' ('+r.left+')' : '');
function setL(l){ L=l; localStorage.setItem('ppe_lang',l); render(); }
function fmt(d){ if(!d) return ''; return new Date(d).toLocaleString(L==='id'?'id-ID':'en-GB',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'})+' WIB'; }
function itemsTxt(j){ try{ return (typeof j==='string'?JSON.parse(j):j).map(i=>i.qty+' × '+i.item+(i.size?' ('+i.size+')':'')).join(', ');}catch(e){return j;} }
function flagsHtml(j){
  let a=[]; try{ a = JSON.parse(j||'[]'); }catch(e){}
  return a.map(f=>{ const p=f.split('|'); return '<span class="flag'+(p[0]==='AUTO'?' inf':'')+'">'+esc(t('f_'+p[0])+(p[1]?p[1]+(p[2]?' ('+p[2]+')':''):''))+'</span>'; }).join('');
}
function render(){
  document.documentElement.lang = L; $('ttl').textContent = t('ttl');
  $('le').className = L==='en'?'on':''; $('li').className = L==='id'?'on':'';
  if(qs.get('pass')) return passView();
  if(qs.get('mode')==='staff') return staffInit();
  empInit();
}

 coverall:{t:{en:'FR coverall',id:'Coverall FR'},i:{
  en:['Wash as per the maker’s instructions, mild detergent, warm (not hot) water. No bleach, fabric softener or harsh chemicals – they damage the FR treatment.','Tumble dry on low heat or hang dry. Avoid high heat.','Store clean and dry, away from direct sunlight and chemicals.','Inspect regularly for holes, tears and worn areas. Repair with FR-rated thread and patches, or replace.','Do not alter: no cutting, sewing or non-FR patches/logos unless certified FR.'],
  id:['Cuci sesuai petunjuk pabrik, deterjen lembut, air hangat (bukan panas). Jangan pakai pemutih, pelembut atau bahan kimia keras – merusak lapisan FR.','Keringkan dengan panas rendah atau digantung. Hindari panas tinggi.','Simpan bersih dan kering, jauh dari sinar matahari langsung dan bahan kimia.','Periksa rutin lubang, robekan dan bagian aus. Perbaiki dengan benang dan tambalan berstandar FR, atau ganti.','Jangan dimodifikasi: tidak memotong, menjahit atau menambah tambalan/logo non-FR kecuali bersertifikat FR.']}},
 helmet:{t:{en:'Safety helmet',id:'Helm safety'},i:{
  en:['Clean the shell with mild soap and warm water. No harsh chemicals, solvents or abrasive cleaners.','Check for cracks, dents or deep scratches. Inspect the suspension for broken straps or worn parts and replace it if worn.','Keep away from heat sources, direct sunlight and chemicals.','Store in a cool, dry place. Do not hang on hooks that can deform the suspension.','Do not throw, drop or sit on it, and do not use it to carry or store things.'],
  id:['Bersihkan cangkang dengan sabun lembut dan air hangat. Jangan gunakan bahan kimia keras, pelarut atau pembersih abrasif.','Periksa retak, penyok atau goresan dalam. Periksa suspensi dari tali putus atau bagian aus dan ganti jika aus.','Jauhkan dari sumber panas, sinar matahari langsung dan bahan kimia.','Simpan di tempat sejuk dan kering. Jangan digantung pada pengait yang dapat merusak suspensi.','Jangan dilempar, dijatuhkan atau diduduki, dan jangan dipakai untuk membawa atau menyimpan barang.']}},
 shoes:{t:{en:'Safety shoes',id:'Sepatu safety'},i:{
  en:['Wipe off dirt, oil and chemicals after each shift. Damp cloth for leather, mild soap for synthetic. No harsh chemicals.','Check the sole and toe cap. Replace if the sole is worn down or the toe cap is exposed.','If wet, air-dry at room temperature. Never use direct heat (heater or sunlight).','Store in a cool, dry place. Avoid damp lockers and hot vehicles.'],
  id:['Lap kotoran, oli dan bahan kimia setelah setiap shift. Kain lembap untuk kulit, sabun lembut untuk sintetis. Jangan bahan kimia keras.','Periksa sol dan pelindung ujung. Ganti jika sol aus atau pelindung ujung terlihat.','Jika basah, keringkan pada suhu ruang. Jangan gunakan panas langsung (pemanas atau matahari).','Simpan di tempat sejuk dan kering. Hindari loker lembap dan kendaraan panas.']}},
 gloves:{t:{en:'Gloves',id:'Sarung tangan'},i:{
  en:['Disposable gloves: do not wash, discard after use.','Reusable gloves: rinse off dirt and chemicals immediately, wash with mild soap and lukewarm water.','Air-dry in a cool, well-ventilated area. No direct sunlight, heaters or dryers.','Before each use check for holes, tears, thinning or chemical damage. Replace immediately if compromised.','Store clean and dry, away from sunlight and chemicals. Do not fold or crush.'],
  id:['Sarung tangan sekali pakai: jangan dicuci, buang setelah dipakai.','Sarung tangan pakai ulang: bilas kotoran dan bahan kimia segera, cuci dengan sabun lembut dan air suam.','Angin-anginkan di tempat sejuk dan berventilasi. Jangan di sinar matahari langsung, pemanas atau pengering.','Sebelum dipakai periksa lubang, robekan, menipis atau kerusakan kimia. Segera ganti jika rusak.','Simpan bersih dan kering, jauh dari sinar matahari dan bahan kimia. Jangan dilipat atau ditekan.']}},
 glasses:{t:{en:'Safety glasses',id:'Kacamata safety'},i:{
  en:['Clean with mild soap and water or a lens cleaning solution. Dry with a microfibre cloth, not paper towels.','Keep in a protective case when not in use. Do not leave them in hot places such as inside a car.','Check for scratches, cracks or loose parts. Replace if lenses are too scratched or the frame is damaged – visibility and safety are reduced.','Remove and put on with both hands. Do not place face-down on surfaces.'],
  id:['Bersihkan dengan sabun lembut dan air atau cairan pembersih lensa. Keringkan dengan kain mikrofiber, bukan tisu.','Simpan di kotak pelindung saat tidak dipakai. Jangan tinggalkan di tempat panas seperti di dalam mobil.','Periksa goresan, retak atau bagian longgar. Ganti jika lensa terlalu tergores atau rangka rusak – mengurangi pandangan dan keselamatan.','Lepas dan pasang dengan dua tangan. Jangan diletakkan menghadap ke bawah.']}},
 harness:{t:{en:'Full body harness (on loan)',id:'Full body harness (pinjaman)'},i:{
  en:['On loan: it stays store property. Return it when the job is finished or when the store asks.','Before every use check the webbing, stitching, buckles and D-rings. If anything is damaged or doubtful, do not use it – return it to the store.','Adjust it to fit you, with the suspension trauma strap fitted.','After a fall or full load, stop using it. It stays out of service until a competent person (PPE Verifier) has inspected it.','Use it only to protect people, never for any other purpose.','Follow the maker’s manual for cleaning and storage.'],
  id:['Pinjaman: tetap milik gudang. Kembalikan setelah pekerjaan selesai atau jika gudang meminta.','Sebelum dipakai periksa webbing, jahitan, gesper dan D-ring. Jika ada yang rusak atau meragukan, jangan dipakai – kembalikan ke gudang.','Sesuaikan agar pas, dengan tali suspension trauma terpasang.','Setelah jatuh atau menahan beban penuh, hentikan pemakaian. Tidak boleh dipakai sampai diperiksa orang kompeten (PPE Verifier).','Gunakan hanya untuk melindungi orang, tidak untuk keperluan lain.','Ikuti buku petunjuk pabrik untuk pembersihan dan penyimpanan.']}},
 hearing:{t:{en:'Ear plugs & ear muffs',id:'Ear plug & ear muff'},i:{
  en:['Fit them snugly with clean hands, free of dirt or grease, so they seal well.','You look after and check your own ear muffs; supervisors include hearing protection in their regular inspections.','Noise above 85 dB(A) needs hearing protection. People working in high-noise areas have an annual hearing test.'],
  id:['Pasang dengan rapat menggunakan tangan bersih, bebas kotoran atau gemuk, agar menutup dengan baik.','Anda merawat dan memeriksa ear muff sendiri; supervisor memasukkan pelindung pendengaran dalam inspeksi rutin.','Kebisingan di atas 85 dB(A) memerlukan pelindung pendengaran. Pekerja di area bising tinggi menjalani tes pendengaran tahunan.']}},
 resp:{t:{en:'Respirators & dust masks',id:'Respirator & masker debu'},i:{
  en:['Tight-fitting respirators need medical fitness and a fit test (at least every 2 years, or after weight, dental or facial changes).','Be clean-shaven where the mask seals; no jewellery or make-up on the seal area.','The type to use is set by the site risk assessment or the chemical’s safety data sheet.'],
  id:['Respirator ketat memerlukan kelayakan medis dan uji kecocokan (minimal tiap 2 tahun, atau setelah perubahan berat badan, gigi atau wajah).','Bersih cukur di area penyegelan masker; tanpa perhiasan atau make-up di area segel.','Jenis yang dipakai ditentukan oleh penilaian risiko lokasi atau lembar data keselamatan bahan kimia.']}}
};
function careKey(n){ n=String(n).toLowerCase();
  if(n.includes('coverall')&&!n.includes('visitor')&&!n.includes('chemical')&&!n.includes('regular')) return 'coverall';
  if(!n.includes('welding')&&(n.includes('hard hat')||n.includes('helmet')||n.includes('suspension')||n.includes('chin strap'))) return 'helmet';
  if(n.includes('shoe')||n.includes('boot')) return 'shoes';
  if(n.includes('harness')) return 'harness';
  if(n.includes('ear plug')||n.includes('ear muff')) return 'hearing';
  if(n.includes('respirator')||n.includes('n95')||n.includes('dust mask')) return 'resp';
  if(n.includes('glove')&&!n.includes('electrician')) return 'gloves';
  if(n.includes('glass')||n.includes('spec')) return 'glasses'; return ''; }
function needsRet(n){ n=String(n).toLowerCase(); if(/disposable|chemical protective|visitor/.test(n)) return false; return /coverall|glass|glove|ear muff/.test(n); }
function catOf(n){ return catalog.find(c=>c.Item===n)||{}; }
function isFree(n){ return String(catOf(n).Approval).toLowerCase()==='no'; }
function isLoanIt(n){ return String(catOf(n).Loan)==='Always'; }
function mk(i){ return (String(i.Approval).toLowerCase()==='no'?' ★':'')+(String(i.Loan)==='Always'?' ↺':''); }
function itemHint(n){ if(!n) return ''; return (isFree(n)?`<div class="small" style="color:#175cd3;margin:2px 0">★ ${t('hFree')}</div>`:'')+(isLoanIt(n)?`<div class="small" style="color:#b54708;margin:2px 0">↺ ${t('hLoan')}</div>`:''); }
function splitNote(){ const its=readItems(), f=its.filter(i=>isFree(i.item)).length, p=its.length-f; $('splitnote').innerHTML = (f&&p)?`<div class="small" style="background:#d1e9ff;border-radius:8px;padding:8px;margin-top:6px">${t('splitNote')}</div>`:''; }
function careBlock(k){ const c=CARE[k]; if(!c) return ''; return `<b>${esc(c.t[L])}</b><ul style="margin:6px 0 0;padding-left:18px;font-size:14px">${c.i[L].map(x=>`<li style="margin-bottom:4px">${esc(x)}</li>`).join('')}</ul>`; }
function careDetails(itemName){ const k=careKey(itemName); return k?`<details style="margin:2px 0 8px"><summary class="small" style="cursor:pointer;color:var(--g)">${t('careTips')} – ${esc(CARE[k].t[L])}</summary><div class="small" style="background:var(--g2);border-radius:8px;padding:8px 10px;margin-top:4px">${careBlock(k)}</div></details>`:''; }
function careView(){
  $('pane').innerHTML = `<div class="card"><b>${t('careTitle')}</b><p class="small">${t('careIntro')}</p></div>` + Object.keys(CARE).map(k=>`<details class="card"><summary style="cursor:pointer"><b>${esc(CARE[k].t[L])}</b></summary><div style="margin-top:8px">${careBlock(k)}</div></details>`).join('');
}
function careRow(sel){ const w=sel.closest('.rw'); if(!w) return; const c=w.querySelector('.care'); c.innerHTML = itemHint(sel.value)+(sel.value?careDetails(sel.value):''); if($('splitnote')) splitNote(); }
function repNote(){ const r=$('rsn').value; $('rnote').innerHTML = r.startsWith('Replacement')?`<div class="small" style="background:#fef0c7;border-radius:8px;padding:8px;margin-top:6px">${t('repNote')}</div>`:''; $('fac').classList.toggle('hide',r!=='Lost'); }
async function empInit(){
  $('app').innerHTML = `<div class="tabs"><button id="tN" onclick="eTab='new';empInit()">${t('newReq')}</button><button id="tM" onclick="eTab='mine';empInit()">${t('mine')}</button><button id="tC" onclick="eTab='care';empInit()">${t('careTab')}</button><button id="tT" onclick="eTab='train';empInit()">${t('trainTab')}</button></div><div id="pane"></div>`;
  $('tN').className = eTab==='new'?'on':''; $('tM').className = eTab==='mine'?'on':''; $('tC').className = eTab==='care'?'on':''; $('tT').className = eTab==='train'?'on':'';
  if(eTab==='mine') return mineView();
  if(eTab==='care') return careView();
  if(!catalog.length){ const [a,b] = await Promise.all([api({action:'items'}),api({action:'people'})]); if(a.ok) catalog=a.items; if(b.ok) people=b.people; }
  if(eTab==='train') return trainView();
  formView();
}
function formView(){
  const cos = [...new Set(people.map(p=>p.Company))].sort();
  $('pane').innerHTML = `<div class="card">
  <div id="reg"><label>${t('company')}</label><select id="co" onchange="fillNames()"><option value="">${t('select')}</option>${cos.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
  <label>${t('name')}</label><select id="per" onchange="needSpon()"><option value="">${t('select')}</option></select></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nl" style="width:auto" onchange="$('manual').classList.toggle('hide',!this.checked);$('reg').classList.toggle('hide',this.checked);needSpon()"> ${t('notListed')}</label>
  <div id="manual" class="hide"><label>${t('name')}</label><input id="mn"><label>${t('company')}</label><input id="mc" list="depts"><datalist id="depts">${cos.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <div id="spon" class="hide"><div class="small" style="margin-top:8px">${t('sponsorNote')}</div><label>${t('sponsor')}</label><select id="sc" onchange="sponNames()"><option value="">${t('company')}…</option>${[...new Set(people.filter(p=>p.Sponsor).map(p=>p.Company))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="sp" style="margin-top:6px"><option value="">${t('select')}</option></select></div>
  <label>${t('items')}</label><div id="rows"></div><div class="small" style="margin:4px 0">${t('mkFree')} · ${t('mkLoan')}</div><button class="s" onclick="addRow()">${t('add')}</button> <button class="s" onclick="addKit()">${t('kit')}</button><div id="splitnote"></div>
  <label>${t('reason')}</label><select id="rsn" onchange="repNote()">${REASONS.map(r=>`<option value="${r}">${t('R_'+r.replace('-','_'))}</option>`).join('')}</select>
  <div id="rnote"></div><div id="fac" class="hide"><div class="small" style="background:#fef0c7;border-radius:8px;padding:8px;margin-top:6px">${t('lostNote')}</div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fr" style="width:auto"> ${t('facRep')}</label><input id="fn" placeholder="${t('facName')}"></div>
  <label>${t('remark')}</label><textarea id="rm" rows="2"></textarea>
  <button class="p" id="go" onclick="submitReq()">${t('submit')}</button><div id="msg"></div></div>`;
  addRow();
}
function needSpon(){ const man=$('nl').checked, p=people.find(x=>x.PersonID==$('per').value); $('spon').classList.toggle('hide',!(man||(p&&p.NoEmail))); }
function sponNames(){ const c=$('sc').value; $('sp').innerHTML=`<option value="">${t('select')}</option>`+people.filter(p=>p.Sponsor&&p.Company===c).sort((a,b)=>a.Name.localeCompare(b.Name)).map(p=>`<option value="${esc(p.PersonID)}">${esc(p.Name)}</option>`).join(''); }
function fillNames(){ const c=$('co').value; $('per').innerHTML = `<option value="">${t('select')}</option>` + people.filter(p=>p.Company===c).sort((a,b)=>a.Name.localeCompare(b.Name)).map(p=>`<option value="${esc(p.PersonID)}">${esc(p.Name)}</option>`).join(''); }
function addKit(){ if(!$('rows')) return; $('rows').innerHTML=''; catalog.filter(i=>String(i.Kit).toLowerCase()==='yes').forEach(i=>addRow(i.Item)); $('rsn').value='New'; repNote(); splitNote(); }
function addRow(pre){
  const w = document.createElement('div'); w.className='rw'; const d = document.createElement('div'); d.className='row';
  d.innerHTML = `<select class="it" onchange="sizes(this);careRow(this)"><option value="">${t('select')}</option>${[...new Set(catalog.map(i=>i.Category))].map(c=>`<optgroup label="${esc(c)}">${catalog.filter(i=>i.Category===c).map(i=>`<option value="${esc(i.Item)}" data-s="${esc(i.Sizes)}">${esc(i.Item)}${mk(i)}</option>`).join('')}</optgroup>`).join('')}</select><select class="sz"><option value="">${t('size')}</option></select><input class="qt" type="number" min="1" max="20" value="1"><button class="d" onclick="this.closest('.rw').remove();splitNote()">×</button>`;
  const cr = document.createElement('div'); cr.className='care'; w.appendChild(d); w.appendChild(cr); $('rows').appendChild(w);
  if(typeof pre==='string'){ const s=d.querySelector('.it'); s.value=pre; sizes(s); careRow(s); }
}
function sizes(sel){
  const s=(sel.selectedOptions[0].dataset.s||'').split(',').filter(Boolean), z=sel.parentNode.querySelector('.sz');
  z.innerHTML = '<option value="">'+(s.length?t('size'):'–')+'</option>'+s.map(x=>`<option>${esc(x)}</option>`).join('');
}
function readItems(){
  return [...document.querySelectorAll('#rows .row')].map(r=>({item:r.querySelector('.it').value,size:r.querySelector('.sz').value,qty:r.querySelector('.qt').value,need:r.querySelector('.sz').options.length>1})).filter(i=>i.item);
}
function compress(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.6)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); });
}
async function submitReq(){
  const items = readItems(), man = $('nl').checked, reason = $('rsn').value;
  if(!items.length || items.some(i=>i.need && !i.size)) return $('msg').innerHTML = '<div class="err">'+esc(err('NO_ITEMS'))+'</div>';
  const body = {action:'submit',items:items.map(({item,size,qty})=>({item,size,qty})),reason,remark:$('rm').value,facilityReported:reason==='Lost'&&$('fr').checked,facilityName:reason==='Lost'?$('fn').value.trim():''};
  if(man){ body.newPerson = {name:$('mn').value.trim(),company:$('mc').value.trim()}; }
  else { body.personId = $('per').value; if(!body.personId) return $('msg').innerHTML = '<div class="err">'+esc(t('name'))+'?</div>'; }
  if(!$('spon').classList.contains('hide')) body.sponsorId = $('sp').value;
  $('go').disabled = true;
  const r = await api(body);
  if(!r.ok){ $('go').disabled=false; return $('msg').innerHTML = '<div class="err">'+E(r)+'</div>'; }
  const parts = r.parts||[{id:r.id,token:r.token,auto:false}], l = myList(); parts.slice().reverse().forEach(pp=>l.unshift({id:pp.id,token:pp.token})); localStorage.setItem('ppe_my',JSON.stringify(l.slice(0,20)));
  $('pane').innerHTML = `<div class="card">${parts.map(pp=>`<div class="ok">${t(pp.auto?'sentAuto':'sent')}</div><p>${t('ref')}: <b>${esc(pp.id)}</b></p>`).join('')}<button class="p" onclick="eTab='mine';empInit()">${t('mine')}</button><button class="s" style="width:100%;margin-top:8px" onclick="eTab='care';empInit()">${t('careView')}</button></div>`;
}
async function mineView(){
  const l = myList(); if(!l.length) return $('pane').innerHTML = `<div class="card small">${t('noReq')}</div>`;
  $('pane').innerHTML = '<div id="ml"></div>';
  const rs = await Promise.all(l.map(x=>api({action:'status',id:x.id,token:x.token}).then(r=>({r,x}))));
  $('ml').innerHTML = rs.filter(z=>z.r.ok).map(({r,x})=>`<div class="card"><b>${esc(r.id)}</b> <span class="pill ${r.status}">${esc(r.status)}</span>
   <div class="items">${esc(itemsTxt(r.approvedItems||r.items))}</div><div class="small">${esc(t(r.status==='Approved'&&r.auto?'s_ApprovedAuto':'s_'+r.status))}<br>${fmt(r.createdAt)}${r.status==='Approved'?'<br>'+t('expires')+': '+fmt(r.expires):''}${r.status==='Issued'?'<br>'+fmt(r.issuedAt)+' · '+esc(r.receipt):''}${r.status==='Rejected'?'<br>'+esc(r.note):''}</div>
   ${r.status==='Issued'?`<button class="s" style="margin-top:8px" onclick="eTab='care';empInit()">${t('careView')}</button>`:''}
   ${r.status==='Requested'?`<button class="d" style="margin-top:8px" onclick="cancelReq('${esc(x.id)}','${esc(x.token)}')">${t('cancel')}</button>`:''}</div>`).join('');
}
async function cancelReq(id,token){ const r = await api({action:'cancel',id,token}); if(!r.ok) alert(err(r.error)); mineView(); }

/* ================= PASS (QR for the store) ================= */
function passView(){
  const id = (qs.get('pass')||'').replace(/[^A-Za-z0-9-]/g,''), code = (location.hash||'').replace(/\D/g,'').slice(0,6);
  if(!id || code.length!==6) return $('app').innerHTML = `<div class="card"><div class="err">${t('passBad')}</div></div>`;
  $('app').innerHTML = `<div class="card" style="text-align:center"><h2 style="margin:4px 0">${t('passTitle')}</h2><div class="small">${esc(id)}</div><div class="otp" style="margin:12px 0;font-weight:700;color:var(--g)">${esc(code)}</div><div id="pq" style="display:flex;justify-content:center;margin:12px"></div><div>${t('passHow')}</div><div class="small" style="margin-top:8px">${t('passWarn')}</div></div>`;
  if(window.QRCode) new QRCode($('pq'),{text:BASE+'?mode=staff&req='+encodeURIComponent(id)+'&code='+code,width:240,height:240});
}

/* ================= NEW-JOINER TRAINING ================= */
const TR_SEC = [
 {t:{en:'1. Before you start: what PPE is for',id:'1. Sebelum mulai: fungsi APD'},
  en:['PPE protects you from injury and occupational illness, but it is the LAST line of defence. It does not replace safer work methods, engineering controls or good work practice.','Order of control: eliminate the hazard, substitute it, engineer it out, use procedures – and only then PPE.','PPE must be the right type for the hazard, in good condition and used correctly. Your supervisor selects it for your task (job hazard analysis) and trains you.'],
  id:['APD melindungi Anda dari cedera dan penyakit akibat kerja, tetapi merupakan pertahanan TERAKHIR. APD tidak menggantikan metode kerja yang lebih aman, pengendalian teknik atau praktik kerja yang baik.','Urutan pengendalian: hilangkan bahaya, ganti, pengendalian teknik, prosedur – baru APD.','APD harus sesuai bahaya, dalam kondisi baik dan dipakai dengan benar. Supervisor memilihnya sesuai tugas (analisis bahaya pekerjaan) dan melatih Anda.']},
 {t:{en:'2. Basic PPE for the process area',id:'2. APD dasar untuk area proses'},
  en:['Everyone entering a process area wears: safety helmet, safety glasses, safety boots and an FR coverall.','Ear plugs and gloves: keep them with you, within easy reach, and use them when required (signs, noisy work, hand hazards). The PPE matrix lists ear plugs in the basic set.','No PPE needed in: the Central Control Room, non-process offices, meeting rooms, canteen, temple and restrooms.','The laboratory and workshop have their own PPE requirements.','Visitors entering the process area wear an FR coverall too. Their host gets it for them.'],
  id:['Setiap orang yang masuk area proses memakai: helm safety, kacamata safety, sepatu safety dan coverall FR.','Ear plug dan sarung tangan: bawa, mudah dijangkau, dan pakai bila diperlukan (rambu, pekerjaan bising, bahaya tangan). Matriks APD memasukkan ear plug dalam perlengkapan dasar.','Tidak perlu APD di: Ruang Kontrol Pusat, kantor non-proses, ruang rapat, kantin, tempat ibadah dan toilet.','Laboratorium dan bengkel memiliki persyaratan APD sendiri.','Tamu yang masuk area proses juga memakai coverall FR. Host-nya yang menyediakan.']},
 {t:{en:'3. Extra PPE for specific tasks',id:'3. APD tambahan untuk tugas tertentu'},matrix:true},
 {t:{en:'4. How to request PPE here',id:'4. Cara meminta APD di sini'},ol:true,
  en:['Scan the QR poster or open the PPE app link. Choose your department and name. Not in the list (new joiner)? Tick “I am new” and choose a sponsor – the code goes to your sponsor and you show your ID at the store.','Pick the items and sizes. New joiner: tap “Full joiner kit” and choose reason “New”. Replacement: bring the old item (coverall, glasses, gloves, ear muffs). Lost: report it to the Head of Facility first.','Items marked ★ (ear plugs, safety glasses, gloves, rubber gloves) need NO approval: your request is recorded and the pass code arrives by email at once.','All other items go to the HSSE Manager for approval. When approved you get a 6-digit code by email (valid 14 days).','Go to the PPE store. Show the code or the QR pass from the email. The storekeeper scans or types it and hands over your PPE. You receive a receipt by email.','The full body harness ↺ is LOANED: it stays store property. Request it like other PPE (needs approval), return it to the store when the job is finished and the store records its condition. You get a reminder if it is overdue.','Limits: up to 3 open requests per person, and no second open request for the same item.','Every request, approval and issue is recorded, so PPE cannot be collected in your name without your code.'],
  id:['Pindai poster QR atau buka tautan aplikasi APD. Pilih departemen dan nama Anda. Tidak ada di daftar (karyawan baru)? Centang “Saya karyawan baru” dan pilih sponsor – kode dikirim ke sponsor dan Anda menunjukkan ID di gudang.','Pilih item dan ukuran. Karyawan baru: ketuk “Paket lengkap karyawan baru” dan pilih alasan “Baru”. Penggantian: bawa item lama (coverall, kacamata, sarung tangan, ear muff). Hilang: lapor dulu ke Head of Facility.','Item bertanda ★ (ear plug, kacamata safety, sarung tangan, sarung tangan karet) TIDAK perlu persetujuan: permintaan dicatat dan kode pass langsung dikirim lewat email.','Item lainnya masuk ke HSSE Manager untuk disetujui. Setelah disetujui Anda menerima kode 6 digit lewat email (berlaku 14 hari).','Datang ke gudang APD. Tunjukkan kode atau QR pass dari email. Petugas gudang memindai atau mengetik kode lalu menyerahkan APD. Anda menerima bukti lewat email.','Full body harness ↺ DIPINJAMKAN: tetap milik gudang. Ajukan seperti APD lain (perlu persetujuan), kembalikan ke gudang setelah pekerjaan selesai dan gudang mencatat kondisinya. Anda mendapat pengingat jika terlambat.','Batas: maksimal 3 permintaan terbuka per orang, dan tidak ada permintaan terbuka kedua untuk item yang sama.','Setiap permintaan, persetujuan dan penyerahan tercatat, sehingga APD tidak dapat diambil atas nama Anda tanpa kode Anda.']},
 {t:{en:'5. Your PPE, one by one',id:'5. APD Anda, satu per satu'},ppe:true},
 {t:{en:'6. Your responsibilities',id:'6. Tanggung jawab Anda'},
  en:['Follow the PPE procedure and use the PPE prescribed for the work.','Check every PPE item is in good working condition before work. Damaged or faulty PPE is replaced BEFORE you start.','Clean your PPE as the maker recommends and look after it.','Special PPE such as breathing apparatus needs competence and certification.','Report lost PPE to the Head of Facility first, then request a replacement.','Supervisors: make sure PPE is fit for purpose, people are trained, PPE is used correctly and replaced when needed.'],
  id:['Ikuti prosedur APD dan pakai APD yang ditetapkan untuk pekerjaan.','Periksa setiap APD dalam kondisi baik sebelum bekerja. APD rusak atau bermasalah diganti SEBELUM Anda mulai.','Bersihkan APD sesuai rekomendasi pabrik dan rawat dengan baik.','APD khusus seperti alat bantu pernapasan memerlukan kompetensi dan sertifikasi.','Laporkan APD hilang ke Head of Facility dahulu, lalu ajukan penggantian.','Supervisor: pastikan APD sesuai tujuan, orang terlatih, APD dipakai dengan benar dan diganti bila perlu.']}
];

  en:['White helmet for EcoOils staff. New joiners (and contractor partners) wear a yellow helmet for their first year.','The chin strap must be ready when you enter site and worn at ALL times.','Only DOSH-approved safety helmets are allowed on site.','Replace it after any impact or drop, when the head cradle is damaged, or 5 years after the manufacture date (polycarbonate). The date is stamped inside the helmet. Suspensions and liners are replaced as the maker recommends.'],

 {k:'harness',care:'harness',t:{en:'Full body harness (loaned)',id:'Full body harness (pinjaman)'},std:'ISO 10333-1 · ANSI/ASSP Z359',
  en:['LOANED: the full body harness stays store property. Request it, use it for the job, then return it.','Every harness comes with a suspension trauma strap. It must fit you and adjust properly.','Free fall must never exceed 1.8 m (6 ft) and you must not reach a lower level. Use the buddy system – working alone at height is strictly prohibited.','Fall clearance check: lanyard length + deceleration distance (3.5 ft) + height of the harness D-ring from your feet (6 ft) + 2 ft safety factor. With a 6 ft lanyard that is about 17.5 ft (5.3 m) below the anchor.','Anchor points must hold at least 2,267 kg (5,000 lb) per person and be chosen by a competent person. Guardrails, handrails and piping are NOT anchor points.','No knots in lanyards or lifelines; avoid sharp edges. Only locking snap hooks; never connect a snap hook to another snap hook.','After a fall or full load the equipment is taken out of service until a PPE Verifier (competent person) has inspected it. Self-retracting lanyards that took a fall are discarded.','Use fall protection only to protect people – never for any other purpose.'],
  id:['PINJAMAN: full body harness tetap milik gudang. Ajukan permintaan, pakai untuk pekerjaan, lalu kembalikan.','Setiap harness dilengkapi tali suspension trauma. Harus pas dan dapat disesuaikan dengan baik.','Jatuh bebas tidak boleh melebihi 1,8 m (6 ft) dan Anda tidak boleh mencapai level di bawahnya. Gunakan sistem buddy – bekerja sendirian di ketinggian dilarang keras.','Cek jarak bebas jatuh: panjang lanyard + jarak perlambatan (3,5 ft) + tinggi D-ring harness dari kaki (6 ft) + faktor keamanan 2 ft. Dengan lanyard 6 ft jaraknya sekitar 17,5 ft (5,3 m) di bawah titik angkur.','Titik angkur harus menahan minimal 2.267 kg (5.000 lb) per orang dan dipilih oleh orang kompeten. Pagar pengaman, handrail dan pipa BUKAN titik angkur.','Tidak boleh ada simpul pada lanyard atau lifeline; hindari tepi tajam. Hanya snap hook terkunci; jangan sambungkan snap hook ke snap hook lain.','Setelah jatuh atau menahan beban penuh, peralatan dikeluarkan dari pemakaian sampai diperiksa oleh PPE Verifier (orang kompeten). Self-retracting lanyard yang menahan jatuh dibuang.','Gunakan perlindungan jatuh hanya untuk melindungi orang – tidak untuk keperluan lain.']},
 {k:'resp',care:'resp',t:{en:'Respiratory protection',id:'Pelindung pernapasan'},std:'',
  en:['The type is set by the site risk assessment or the chemical’s safety data sheet: N95 dust mask, half-face with organic-vapour cartridge, full-face with P3 filter, or SCBA.','Tight-fitting respirators need medical fitness and a fit test (at least every 2 years, or after weight, dental or facial changes). Use the same make, model and size you were tested on.','You must be clean-shaven where the mask seals. No jewellery or make-up on the seal area; pull hair away.','Breathing apparatus (SCBA) requires training by a competent provider for that brand. SCBA is not requested through this app.'],

function trainView(){
  const sec = TR_SEC.map((s,i)=>{
    let body='';
    if(s.matrix) body = `<div class="small" style="margin-bottom:6px">${t('trMatrixNote')}</div><table><tr><th>${t('trTask')}</th><th>${t('trExtra')}</th></tr>${TR_TASKS.map(r=>`<tr><td>${esc(L==='id'?r[1]:r[0])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>`;
    else if(s.ppe) body = TR_PPE.map(p=>{ const c = p.care && CARE[p.care]; return `<div style="border-top:1px solid var(--l);padding:10px 0"><b>${esc(p.t[L])}</b>${p.std?` <span class="small">· ${t('trStd')}: ${esc(p.std)}</span>`:''}<ul style="margin:6px 0;padding-left:18px;font-size:14px">${p[L].map(x=>`<li style="margin-bottom:4px">${esc(x)}</li>`).join('')}</ul>${c?`<details><summary class="small" style="cursor:pointer;color:var(--g)">${t('trCare')}</summary><div class="small" style="background:var(--g2);border-radius:8px;padding:8px 10px;margin-top:4px">${careBlock(p.care)}</div></details>`:''}</div>`; }).join('');
    else body = `<${s.ol?'ol':'ul'} style="margin:0;padding-left:20px;font-size:14px">${s[L].map(x=>`<li style="margin-bottom:6px">${esc(x)}</li>`).join('')}</${s.ol?'ol':'ul'}>`;
    return `<details class="card" ${i===0?'open':''}><summary style="cursor:pointer"><b>${esc(s.t[L])}</b></summary><div style="margin-top:8px">${body}</div></details>`;
  }).join('');
  const quiz = TR_QUIZ.map((q,i)=>`<div class="rec"><b>${i+1}. ${esc(q.q[L])}</b>${q.o[L].map((o,k)=>`<label style="display:flex;gap:8px;align-items:flex-start;color:#1a1a1a;margin:6px 0"><input type="radio" name="q${i}" value="${k}" style="width:auto;margin-top:4px"> <span>${esc(o)}</span></label>`).join('')}<div id="qe${i}" class="small"></div></div>`).join('');
  $('pane').innerHTML = `<div class="card"><b>${t('trTitle')}</b><p class="small">${t('trIntro')}</p><div class="small">${t('trSrc')}</div><button class="s noprint" style="margin-top:8px" onclick="document.querySelectorAll('#pane details').forEach(d=>d.open=true);window.print()">${t('trPrint')}</button></div>${sec}
  <div class="card"><b>${t('trQuiz')}</b>${quiz}<button class="p" onclick="gradeQuiz()">${t('trCheck')}</button><div id="qres"></div></div><div id="trrec"></div>`;
}
let TQ = {score:0,total:TR_QUIZ.length};
function gradeQuiz(){
  let sc=0, all=true;
  TR_QUIZ.forEach((q,i)=>{ const v=document.querySelector(`input[name=q${i}]:checked`); if(!v) all=false; });
  if(!all) return $('qres').innerHTML = `<div class="err">${t('trAll')}</div>`;
  TR_QUIZ.forEach((q,i)=>{ const v=Number(document.querySelector(`input[name=q${i}]:checked`).value), ok=v===q.a; if(ok) sc++; $('qe'+i).innerHTML = `<span style="color:${ok?'#027a48':'#b42318'}"><b>${t(ok?'trRight':'trWrong')}.</b></span> ${esc(q.e[L])}`; });
  TQ = {score:sc,total:TR_QUIZ.length};
  const pass = sc/TR_QUIZ.length >= 0.8;

function stockViz(r){

  const st = (v,m)=> v<=0?'out':(m&&v<=m?'low':'ok'), col = {out:'#b42318',low:'#f79009',ok:'#0b5d3b'};
  const names = Object.keys(g).sort(), max = Math.max(1,...names.map(n=>Math.max(g[n].tot,g[n].min)));
  const untracked = r.items.filter(i=>!g[i.Item]).map(i=>i.Item);
  const cards = names.map(n=>{ const x=g[n], s=st(x.tot,x.min); return `<div style="border:1px solid var(--l);border-radius:8px;padding:8px 10px;margin:6px 0;border-left:6px solid ${col[s]}">

    <div class="small" style="margin-top:4px">${x.rows.filter(z=>z.Size).map(z=>{ const q=st(Number(z.OnHand),Number(z.MinLevel||0)); return `<span style="display:inline-block;margin:2px 6px 2px 0;color:${col[q]}">${esc(z.Size)}: <b>${esc(z.OnHand)}</b></span>`; }).join('')}${lau[n]?` · ${t('laundryL')}: ${lau[n]}`:''}</div></div>`; }).join('');
  const bars = names.map(n=>{ const x=g[n], s=st(x.tot,x.min); return `<div class="bar"><span class="n">${esc(n)}</span><span style="flex:1;position:relative;height:16px;background:#eef0f2;border-radius:4px"><i style="width:${Math.max(1,x.tot/max*100)}%;background:${col[s]};height:16px"></i>${x.min?`<span style="position:absolute;top:-2px;bottom:-2px;left:${x.min/max*100}%;border-left:2px dashed #1a1a1a"></span>`:''}</span><b>${x.tot}</b></div>`; }).join('');
  const tr = r.trend||[], tm = Math.max(1,...tr.map(d=>Math.max(d.out,d.inn))), W=300, H=90, bw=W/tr.length;
  const svg = `<svg viewBox="0 0 ${W} ${H+14}" width="100%" role="img">${tr.map((d,i)=>`<rect x="${i*bw+1}" y="${H-d.out/tm*H}" width="${bw/2-1}" height="${d.out/tm*H}" fill="#0b5d3b"/><rect x="${i*bw+bw/2}" y="${H-d.inn/tm*H}" width="${bw/2-1}" height="${d.inn/tm*H}" fill="#175cd3"/>`).join('')}<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#999"/><text x="0" y="${H+11}" font-size="8" fill="#667085">${esc((tr[0]||{}).d||'')}</text><text x="${W}" y="${H+11}" font-size="8" fill="#667085" text-anchor="end">${esc((tr[tr.length-1]||{}).d||'')}</text></svg>`;
  const dem = (r.demand||[]).map(d=>{ const row=r.stock.find(s=>s.Item===d.item&&String(s.Size)===String(d.size)), have=row?Number(row.OnHand):null, short=have==null?null:Math.max(0,d.qty-have); return `<div class="rec small"><b>${esc(d.item)}${d.size?' ('+esc(d.size)+')':''}</b> × ${d.qty}${short>0?` <span style="color:#b42318"><b>${t('shortL')} ${short}</b></span>`:(have!=null?` <span style="color:#027a48">${t('covered')}</span>`:'')}<br>${esc(d.names.join(', '))}</div>`; }).join('');
  return `${dem?`<div class="card"><b>${t('demandT')}</b>${dem}</div>`:''}<div class="card"><b>${t('availT')}</b>${cards||`<div class="small">${t('none')}</div>`}${untracked.length?`<div class="small" style="margin-top:8px">${t('notTr')}: ${untracked.map(esc).join(', ')}</div>`:''}</div>
  <div class="card"><b>${t('chartT')}</b><div class="small">▮ ${t('onhand')} · ┆ ${t('min')}</div>${bars}</div>
  <div class="card"><b>${t('trendT')}</b><div class="small"><span style="color:#0b5d3b">■</span> ${t('issuedL')} · <span style="color:#175cd3">■</span> ${t('recvL')}</div>${svg}</div>`;
}

/* ===== Visitors / temporary loans ===== */
let LI = {hosts:[],items:[]};
async function washDone(item,size){ const q = prompt(t('washQty'),'1'); if(!q) return; const r = await api({action:'laundryDone',pin:S.pin,item,size,qty:q}); if(!r.ok) return alert(err(r.error)+' '+(r.detail||'')); vStock(); }
async function vVisitors(){
  $('pane').innerHTML='…';
  const [a,b] = await Promise.all([api({action:'loanInfo',pin:S.pin}),api({action:'loans',pin:S.pin})]);
  if(!a.ok){ if(!bad(a)) $('pane').innerHTML='<div class="err">'+E(a)+'</div>'; return; }
  LI = a; const loans = b.ok ? b.loans : [];
  const cos = [...new Set(LI.hosts.map(p=>p.Company))].sort(), today = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
  const out = loans.filter(l=>l.Status==='Out'), done = loans.filter(l=>l.Status!=='Out').slice(0,25);
  $('pane').innerHTML = `<div class="card"><b>${t('lend')}</b><div class="small">${t('hostNote')}</div>
  <label>${t('vNames')}</label><input id="vn"><label>${t('vCo')}</label><input id="vc">
  <label>${t('host')}</label><select id="hc" onchange="hostNames()"><option value="">${t('company')}…</option>${cos.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="hp" style="margin-top:6px"><option value="">${t('select')}</option></select>
  <label>${t('items')}</label><div id="lrows"></div><button class="s" onclick="addLRow()">${t('add')}</button>
  <label>${t('purpose')}</label><input id="vp"><button class="p" id="lg" onclick="lend()">${t('lend')}</button><div id="msg"></div></div>
  <h3 style="margin:14px 0 6px">${t('outNow')} (${out.length})</h3>
  ${out.map(l=>{ const its=JSON.parse(l.Items), emp=l.Type==='Employee', od = emp ? (l.Due && new Date(l.Due).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})<today) : new Date(l.CreatedAt).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})<today;
   return `<div class="card" id="l_${esc(l.LoanID)}"><b>${esc(l.Visitors)}</b> <span class="small">· ${esc(l.VisitorCompany)}</span> ${emp?`<span class="pill Approved">${t('empLoan')}</span> `:''}${od?`<span class="pill Rejected">${t('overdue')}</span>`:''}<br><span class="small">${esc(l.LoanID)} · ${emp?t('dueL')+': '+fmt(l.Due):t('host')+': '+esc(l.HostName)} · ${fmt(l.CreatedAt)}</span>${/harness/i.test(l.Items)?`<div class="flag" style="margin-top:6px">${t('harnessNote')}</div>`:''}
   ${its.map((i,k)=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="flex:1">${esc(i.item)}${i.size?' ('+esc(i.size)+')':''} × ${i.qty}</span><input type="number" min="0" max="${i.qty}" value="${i.qty}" class="rq" style="width:70px"></div>`).join('')}
   <label>${t('condL')}</label><select class="cd"><option value="Good">${t('c_Good')}</option><option value="Wash">${t('c_Wash')}</option><option value="Damaged">${t('c_Damaged')}</option></select>
   <button class="p" onclick="retLoan('${esc(l.LoanID)}')">${t('retBtn')}</button><button class="d" style="width:100%;margin-top:8px" onclick="wOff('${esc(l.LoanID)}')">${t('writeOff')}</button><div class="m"></div></div>`; }).join('')||`<div class="card small">${t('none')}</div>`}
  <h3 style="margin:14px 0 6px">${t('histL')}</h3>${done.map(l=>`<div class="rec small"><b>${esc(l.Visitors)}</b> · ${esc(itemsTxt(l.Items))} · ${esc(l.Status)} ${esc(l.Condition)} · ${esc(l.HostName)} · ${fmt(l.ReturnedAt||l.CreatedAt)}</div>`).join('')}`;
  addLRow();
}
function hostNames(){ const c=$('hc').value; $('hp').innerHTML = `<option value="">${t('select')}</option>`+LI.hosts.filter(p=>p.Company===c).sort((a,b)=>a.Name.localeCompare(b.Name)).map(p=>`<option value="${esc(p.PersonID)}">${esc(p.Name)}</option>`).join(''); }
function addLRow(){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<select class="it" onchange="sizes(this)"><option value="">${t('select')}</option>${LI.items.map(i=>`<option value="${esc(i.Item)}" data-s="${esc(i.Sizes)}">${esc(i.Item)}</option>`).join('')}</select><select class="sz"><option value="">${t('size')}</option></select><input class="qt" type="number" min="1" max="20" value="1"><button class="d" onclick="this.parentNode.remove()">×</button>`;
  $('lrows').appendChild(d);
}
async function lend(){
  const items=[...document.querySelectorAll('#lrows .row')].map(r=>({item:r.querySelector('.it').value,size:r.querySelector('.sz').value,qty:r.querySelector('.qt').value,need:r.querySelector('.sz').options.length>1})).filter(i=>i.item);
  if(!items.length||items.some(i=>i.need&&!i.size)) return $('msg').innerHTML='<div class="err">'+esc(err('NO_ITEMS'))+'</div>';
  if(!$('hp').value) return $('msg').innerHTML='<div class="err">'+esc(err('HOST_REQUIRED'))+'</div>';
  $('lg').disabled=true;
  const r=await api({action:'loanCreate',pin:S.pin,visitors:$('vn').value,company:$('vc').value,hostId:$('hp').value,purpose:$('vp').value,items:items.map(({item,size,qty})=>({item,size,qty}))});
  if(!r.ok){ $('lg').disabled=false; return $('msg').innerHTML='<div class="err">'+E(r)+'</div>'; }
  vVisitors();
}
async function retLoan(id){
  const c=$('l_'+id), returned=[...c.querySelectorAll('.rq')].map(i=>i.value), condition=c.querySelector('.cd').value;
  const r=await api({action:'loanReturn',pin:S.pin,id,returned,condition});
  if(!r.ok) return c.querySelector('.m').innerHTML='<div class="err">'+E(r)+'</div>'; vVisitors();
}
async function wOff(id){ const reason=prompt(t('writeWhy')); if(!reason) return; const r=await api({action:'loanWriteOff',pin:S.pin,id,reason}); if(!r.ok) return alert(err(r.error)); vVisitors(); }
render();
</script>
</body>
</html>
