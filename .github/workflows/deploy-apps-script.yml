# Auto-deploys Code.gs to the Google Apps Script project whenever Code.gs changes on main.
# Keeps the existing web-app URL (updates the SAME deployment), and keeps the remote appsscript.json manifest.
#
# One-time setup (see chat steps):
#   1. Fill SCRIPT_ID and DEPLOYMENT_ID below (neither is secret).
#   2. Add the GitHub secret CLASPRC_JSON (contents of ~/.clasprc.json after `clasp login`).
name: Deploy Code.gs to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: "PASTE_SCRIPT_ID_HERE"
      DEPLOYMENT_ID: "PASTE_DEPLOYMENT_ID_HERE"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check setup
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [[ "$SCRIPT_ID" == PASTE_* || "$DEPLOYMENT_ID" == PASTE_* ]]; then
            echo "::error::Fill SCRIPT_ID and DEPLOYMENT_ID in this workflow first."; exit 1
          fi
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Add the CLASPRC_JSON secret (Settings > Secrets and variables > Actions)."; exit 1
          fi

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Pull remote project (keeps manifest), overlay Code.gs, push
        run: |
          mkdir build && cd build
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          cp ../Code.gs ./Code.js
          ls -la
          clasp push --force

      - name: Update the existing web-app deployment (URL unchanged)
        run: |
          cd build
          VERSION=$(grep -m1 -oP "const VERSION = '\K[^']+" ../Code.gs || echo "?")
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "v${VERSION} from GitHub ${GITHUB_SHA::7}"

      - name: Remove login file
        if: always()
        run: rm -f ~/.clasprc.json
